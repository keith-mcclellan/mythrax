name: Sanitation Scorecard

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Run Sanitation Scorecard
        run: |
          python3 scripts/sanitation_scorecard.py > scorecard.md
          cat scorecard.md

      - name: Upload Scorecard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanitation-scorecard
          path: scorecard.md

      - name: Post PR Comment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$GITHUB_REF_NAME" --body-file scorecard.md || true
