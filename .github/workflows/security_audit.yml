name: Security Audit Pipeline

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # Nightly at midnight

permissions:
  issues: write
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Full history for secret scanning

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Security Audit Script
        env:
          GITHUB_ACTIONS: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'PYEOF' > scripts/security_audit.py
          import os
          import re
          import json
          import subprocess
          import shlex
          import urllib.request

          def create_issue(title, body, severity):
              print(f"Filing issue: {title}")
              if 'GITHUB_ACTIONS' in os.environ:
                  try:
                       cmd = f"gh issue create --title {shlex.quote(title)} --body {shlex.quote(body)} --label bug --label agent-found --label security-audit"
                       subprocess.run(cmd, shell=True, check=True)
                       return
                  except Exception as e:
                       pass

              os.makedirs('issues', exist_ok=True)
              filename = title.replace(' ', '_').replace('/', '_').replace(':', '_')
              with open(f"issues/{filename}.md", 'w') as f:
                   f.write(f"---\nlabels: bug, agent-found, security-audit\ntitle: {title}\n---\n\n{body}")

          def audit_secrets():
              print("Auditing for secrets...")
              secrets_regex = re.compile(r'(?i)(api_key|apikey|secret|token|password|passwd|credentials)[\s]*=[\s]*[\'"][^\'"]+[\'"]')
              findings = []

              for root, _, files in os.walk('mythrax-core'):
                  for file in files:
                      if file.endswith(('.rs', '.toml', '.json', '.yaml', '.md', '.py')):
                          filepath = os.path.join(root, file)
                          try:
                              with open(filepath, 'r', encoding='utf-8') as f:
                                  for i, line in enumerate(f):
                                      if secrets_regex.search(line) and 'test' not in filepath and 'mock' not in filepath and 'bench' not in filepath and 'secret_filter.rs' not in filepath and 'docs' not in filepath and 'README' not in filepath:
                                          findings.append({'type': 'secret', 'file': filepath, 'line': i + 1, 'content': line.strip()})
                          except Exception as e:
                              pass

              try:
                  git_log = subprocess.check_output(['git', 'log', '-p', '--all', '--no-merges'], text=True, errors='ignore')
                  for match in secrets_regex.finditer(git_log):
                      if "test" not in match.group(0).lower() and "mock" not in match.group(0).lower():
                          findings.append({
                              'type': 'history_secret',
                              'content': match.group(0)
                          })
              except Exception as e:
                   pass

              return findings

          def check_unsafe():
              print("Auditing unsafe blocks...")
              findings = []
              for root, _, files in os.walk('mythrax-core/src'):
                  for file in files:
                      if file.endswith('.rs'):
                          filepath = os.path.join(root, file)
                          try:
                              with open(filepath, 'r', encoding='utf-8') as f:
                                  lines = f.readlines()
                                  for i, line in enumerate(lines):
                                      if 'unsafe {' in line:
                                          has_comment = False
                                          comment = ""
                                          for j in range(max(0, i-3), i):
                                              if '//' in lines[j] or '/*' in lines[j]:
                                                  if 'SAFETY' in lines[j].upper():
                                                       has_comment = True
                                                  comment += lines[j].strip() + " "

                                          findings.append({
                                              'file': filepath,
                                              'line': i + 1,
                                              'has_comment': has_comment,
                                              'comment': comment,
                                              'content': line.strip()
                                          })
                          except Exception as e:
                              pass
              return findings

          def check_dependencies():
              print("Auditing dependencies...")
              findings = []
              try:
                  output = subprocess.check_output(['cargo', 'audit', '--json'], cwd='mythrax-core', text=True)
                  audit_data = json.loads(output)

                  for vuln in audit_data.get('vulnerabilities', {}).get('list', []):
                      findings.append({'type': 'cve', 'vuln': vuln})

                  for warning in audit_data.get('warnings', {}).values():
                      for w in warning:
                          if w.get('kind') == 'yanked':
                              findings.append({'type': 'yanked', 'crate': w.get('package', {}).get('name')})
                          elif w.get('kind') == 'unmaintained':
                               findings.append({'type': 'unmaintained', 'crate': w.get('package', {}).get('name')})

              except Exception as e:
                   pass

              try:
                  with open('mythrax-core/Cargo.toml', 'r', encoding='utf-8') as f:
                      content = f.read()
                  deps = []
                  for line in content.split('\n'):
                      if '=' in line and not line.strip().startswith('['):
                          parts = line.split('=')
                          pkg = parts[0].strip()
                          if pkg and not pkg.startswith('#') and 'version' in parts[1] and pkg not in ['mythrax', 'workspace']:
                              deps.append(pkg)
                  for dep in deps:
                      try:
                          url = f"https://crates.io/api/v1/crates/{dep}"
                          req = urllib.request.Request(url, headers={'User-Agent': 'MythraxSecAudit/1.0'})
                          with urllib.request.urlopen(req, timeout=5) as response:
                              data = json.loads(response.read().decode())
                              commits = data.get('crate', {}).get('updated_at', '')
                              if commits and commits < '2023-01-01':
                                   findings.append({'type': 'stale', 'crate': dep, 'updated': commits})
                      except Exception as e:
                          pass
              except Exception as e:
                  pass
              return findings

          def check_input_validation():
              print("Auditing input validation...")
              findings = []
              patterns = [
                  (r'format!\(".*SELECT.*{}.*"\)', 'SQL Injection potential'),
                  (r'Command::new\(.*{}.*\)', 'Command Injection potential'),
                  (r'std::process::Command.*arg\(.*', 'Command args untrusted')
              ]

              for root, _, files in os.walk('mythrax-core/src'):
                  for file in files:
                      if file.endswith('.rs'):
                          filepath = os.path.join(root, file)
                          try:
                              with open(filepath, 'r', encoding='utf-8') as f:
                                  content = f.read()
                                  for p, desc in patterns:
                                      if re.search(p, content, re.IGNORECASE):
                                          findings.append({
                                              'type': 'input_validation',
                                              'file': filepath,
                                              'desc': desc
                                          })
                          except Exception as e:
                              pass
              return findings

          def main():
              subprocess.run(['rm', '-rf', 'issues'], check=False)

              report = []
              report.append("# Mythrax Security Advisory Report\n\n")

              secrets = audit_secrets()
              if secrets:
                  report.append("## Secrets Found\n")
                  history_reported = False
                  for s in secrets:
                      if s['type'] == 'secret':
                          report.append(f"- **Critical**: Secret in file `{s['file']}:{s['line']}` - Effort: Low - Remediation: Remove the hardcoded secret and use an environment variable or secure vault.\n")
                          create_issue(f"Hardcoded Secret in {s['file'].split('/')[-1]} line {s['line']}", f"**File**: {s['file']}:{s['line']}\n**Snippet**:\n```\n{s['content']}\n```\n**Severity**: Critical\n**Remediation**: Remove the hardcoded secret and use an environment variable or secure vault.", "Critical")
                      elif not history_reported:
                           report.append(f"- **Critical**: Potential Secret in git history - Effort: High - Remediation: Purge git history using BFG Repo-Cleaner or filter-repo.\n")
                           history_reported = True

              unsafe = check_unsafe()
              if unsafe:
                  report.append("## Unsafe Blocks\n")
                  for u in unsafe:
                      severity = "High" if not u['has_comment'] else "Medium"
                      report.append(f"- **{severity}**: Unsafe block in `{u['file']}:{u['line']}`. Documented SAFETY: {u['has_comment']}. - Effort: Medium - Remediation: Analyze memory safety risk and add `// SAFETY:` or refactor to safe Rust.\n")
                      if not u['has_comment']:
                          create_issue(f"Undocumented Unsafe Block in {u['file'].split('/')[-1]} line {u['line']}", f"**File**: {u['file']}:{u['line']}\n**Snippet**:\n```rust\n{u['content']}\n```\n**Severity**: {severity}\n**Remediation**: Analyze the memory safety risk of this block and document the justification with a `// SAFETY:` comment, or refactor to safe Rust.", severity)

              deps = check_dependencies()
              if deps:
                  report.append("## Dependency Issues\n")
                  for d in deps:
                      if d['type'] == 'cve':
                           vuln = d['vuln']
                           cvss = vuln.get('advisory', {}).get('cvss', None)
                           severity = "High"
                           if isinstance(cvss, dict):
                               pass
                           report.append(f"- **{severity}**: CVE in `{vuln.get('package', {}).get('name')}` - {vuln.get('advisory', {}).get('title')} - Effort: Low - Remediation: Update crate.\n")
                           create_issue(f"CVE in dependency {vuln.get('package', {}).get('name')}", f"**Crate**: {vuln.get('package', {}).get('name')}\n**Title**: {vuln.get('advisory', {}).get('title')}\n**Severity**: {severity}\n**Remediation**: Update the crate to a patched version.", severity)
                      elif d['type'] == 'yanked':
                           report.append(f"- **Medium**: Yanked crate `{d['crate']}` - Effort: Low - Remediation: Switch to a different crate or update to an active version.\n")
                      elif d['type'] == 'stale' or d['type'] == 'unmaintained':
                           report.append(f"- **Low**: Stale/Unmaintained crate `{d['crate']}` - Effort: High - Remediation: Audit crate for safety and consider replacing it.\n")

              inputs = check_input_validation()
              if inputs:
                  report.append("## Input Validation Issues\n")
                  for i in inputs:
                       report.append(f"- **High**: {i['desc']} in `{i['file']}` - Effort: Medium - Remediation: Use parameterized queries, safe command arguments, or perform strict boundary enforcement on untrusted input.\n")
                       create_issue(f"Input Validation Issue in {i['file'].split('/')[-1]}", f"**File**: {i['file']}\n**Description**: {i['desc']}\n**Severity**: High\n**Remediation**: Sanitize and validate all external inputs before use.", "High")

              with open('security_report.md', 'w') as f:
                  f.writelines(report)

              print("Audit complete.")

          if __name__ == '__main__':
              main()
          PYEOF
          python3 scripts/security_audit.py

      - name: Archive Security Report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: security_report.md
