name: CISO Security Audit

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '0 0 * * *'

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  audit:
    name: Run Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-audit
        run: cargo binstall -y cargo-audit

      - name: Run CISO Audit Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/ciso_audit.py
          python3 scripts/ciso_audit.py

      - name: Upload Security Advisory Report
        uses: actions/upload-artifact@v4
        with:
          name: security-advisory-report
          path: security_advisory_report.md
