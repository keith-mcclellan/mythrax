name: Architecture Sanitation Scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  architect_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Architecture Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/architect_scan.py
