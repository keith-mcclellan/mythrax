name: Adversarial CTO Review

on:
  push:
    paths:
      - 'ARCHITECTURE.md'
      - 'mythrax-core/src/**'
      - '.agents/**'
  schedule:
    - cron: '0 0 1,15 * *'

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  adversarial_cto_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Adversarial CTO Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/adversarial_cto.py
