name: Sanitation Scorecard

on:
  push:
    branches:
      - '**'

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Sanitation Scorecard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/sanitation_scorecard.py
          ./scripts/sanitation_scorecard.py
