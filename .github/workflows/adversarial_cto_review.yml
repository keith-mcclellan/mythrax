name: Adversarial CTO Review

on:
  schedule:
    - cron: '0 0 */14 * *' # Bi-weekly
  push:
    paths:
      - 'ARCHITECTURE.md'
      - 'mythrax-core/src/**'
      - '.agents/**'

permissions:
  issues: write
  contents: read

jobs:
  run-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Adversarial CTO Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/adversarial_cto.py
