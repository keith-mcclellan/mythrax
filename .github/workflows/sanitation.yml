name: Architecture Sanitation

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run Sanitation Scorecard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/sanitation_scorecard.py
