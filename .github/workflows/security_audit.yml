name: Nightly Security Audit

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Nightly
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for git secret scan

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Audit Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/security_audit.py
          if [ -f report.md ]; then
            cat report.md
          fi
