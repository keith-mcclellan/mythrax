name: Chief Architect Scan

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  scan_debt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Chief Architect Sanitation Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/scan_debt.py
