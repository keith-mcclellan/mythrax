name: Chief Architect Scan

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  architect_scan:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Need full history for trajectory

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Run Architect Scan
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: |
        python3 scripts/architect_scan.py
