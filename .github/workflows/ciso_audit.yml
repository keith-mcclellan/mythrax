name: CISO Security Audit

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # Nightly at midnight

jobs:
  security-audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Need full history for git secrets scan

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Run CISO Audit Script
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python scripts/ciso_audit.py

    - name: Archive Security Report
      uses: actions/upload-artifact@v3
      with:
        name: security-advisory-report
        path: security_advisory_report.md
