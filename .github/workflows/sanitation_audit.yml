name: Sanitation Scorecard

on:
  push:
    branches:
      - '**'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Generate Scorecard
        run: python3 scripts/sanitation_scorecard.py

      - name: Comment on PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
import os
import urllib.request
import json
import ssl

token = os.environ.get('GH_TOKEN')
repo = os.environ.get('GITHUB_REPOSITORY')
ref = os.environ.get('GITHUB_REF_NAME')

if not all([token, repo, ref]) or not os.path.exists('scorecard.md'):
    print('Missing token, repo, ref or scorecard.md')
    exit(0)

with open('scorecard.md', 'r') as f:
    body = f.read()

url = f'https://api.github.com/repos/{repo}/pulls?head={repo.split(\"/\")[0]}:{ref}'
req = urllib.request.Request(url, headers={'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json'})
ctx = ssl.create_default_context()
# Note: we re-enable SSL verification for security
try:
    with urllib.request.urlopen(req, context=ctx) as response:
        prs = json.loads(response.read().decode())
        if prs:
            pr_number = prs[0]['number']
            comments_url = f'https://api.github.com/repos/{repo}/issues/{pr_number}/comments'
            comment_req = urllib.request.Request(comments_url, data=json.dumps({'body': body}).encode(), headers={'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json'}, method='POST')
            with urllib.request.urlopen(comment_req, context=ctx) as r:
                print('Successfully commented on PR', pr_number)
        else:
            print('No open PR found for branch', ref)
except Exception as e:
    print('Error commenting:', e)
"
      - name: Cleanup Scorecard
        run: rm -f scorecard.md
