name: Nightly and Push Security Audit

on:
  push:
    branches:
      - '**'
  schedule:
    - cron: '0 0 * * *' # Nightly at midnight

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit
        run: if [ ! -f ~/.cargo/bin/cargo-audit ]; then cargo install cargo-audit --locked; fi

      - name: Run Security Audit Script
        run: python3 scripts/security_audit.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
