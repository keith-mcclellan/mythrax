name: Security Audit

on:
  push:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Run Audit
        env:
          GITHUB_ACTIONS: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/security_audit.py
      - name: Upload Report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: security_report.md
      - name: Write to Summary
        run: cat security_report.md >> $GITHUB_STEP_SUMMARY
