name: CISO Nightly Security Audit

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Nightly at midnight
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for git log check

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install toml

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run Audit Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ciso_audit.py
          cat ciso_audit_report.md >> $GITHUB_STEP_SUMMARY
