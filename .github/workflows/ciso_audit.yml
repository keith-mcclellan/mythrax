name: CISO Security Audit

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # Run nightly

permissions:
  issues: write
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for git log analysis

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Install dependencies
        run: pip install toml

      - name: Run CISO Audit Script
        run: python scripts/ciso_audit.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload Security Advisory Report
        uses: actions/upload-artifact@v4
        with:
          name: security-advisory-report
          path: security_advisory_report.md
