name: Adversarial CTO Review

on:
  schedule:
    - cron: '0 0 */14 * *'
  push:
    paths:
      - 'ARCHITECTURE.md'
      - 'mythrax-core/src/**'
      - '.agents/**'
  pull_request:
    paths:
      - 'ARCHITECTURE.md'
      - 'mythrax-core/src/**'
      - '.agents/**'

permissions:
  contents: read
  issues: write

jobs:
  adversarial_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Adversarial CTO analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/adversarial_cto.py
