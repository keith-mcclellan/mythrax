name: Architect Sanitation Scan

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  scan:
    name: Run Architect Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run Architect Scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python scripts/architect_scan.py
